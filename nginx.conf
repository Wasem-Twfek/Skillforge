server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Serve PWA assets directly
    location /icons/ {
        alias /usr/share/nginx/html/icons/;
        try_files $uri $uri/ =404;
    }

    location /screenshots/ {
        alias /usr/share/nginx/html/screenshots/;
        try_files $uri $uri/ =404;
    }

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Handle auth callback specifically
    location /auth/callback {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Handle /api/auth routes by removing /api prefix and forwarding to /auth
    location ~ ^/api/auth/(.*) {
        proxy_pass http://backend:3001/auth/$1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
    
    # Proxy other API requests to the backend
    location ~ ^/(api|health) {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
} 